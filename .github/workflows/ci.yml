name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify contracts
        run: |
          pnpm --filter @reqbug/contracts typecheck
          pnpm --filter @reqbug/contracts test

      - name: Verify core
        run: |
          pnpm --filter @reqbug/core typecheck
          pnpm --filter @reqbug/core test

      - name: Verify signatures
        run: |
          pnpm --filter @reqbug/signatures typecheck
          pnpm --filter @reqbug/signatures test

      - name: Verify generated Worker types
        run: |
          pnpm --filter @reqbug/api-worker cf-typegen
          git diff --exit-code -- apps/api-worker/worker-configuration.d.ts

      - name: Verify API Worker
        run: |
          pnpm --filter @reqbug/api-worker typecheck
          pnpm --filter @reqbug/api-worker test

      - name: Verify web application
        run: |
          pnpm --filter @reqbug/web lint
          pnpm --filter @reqbug/web build